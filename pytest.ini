[pytest]
# Batch A test configuration. Keeps the regression suite isolated from the
# legacy scripts under ./test/ (pre-pytest ad-hoc harness).
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    regression: Batch A regression tests protecting the closed-loop workflow
    slow: tests that hit large library assets or network; skipped by default
filterwarnings =
    default::DeprecationWarning
    ignore::PendingDeprecationWarning
